[general]
dry_run = true
external_change_policy = yield
restore_on_exit = true

[price]
area = SE3
timezone = Europe/Stockholm
provider = elpris_eu
fallback_provider = elprisetjustnu
request_timeout_sec = 5
cache_hours = 36
lookahead_hours = 3

[sampling]
interval_sec = 5
history_samples = 24
busy_core_threshold = 60

[thermal]
warm_temp_c = 60
hot_temp_c = 75
critical_temp_c = 90
recovery_c = 5

[transitions]
promote_samples = 2
relax_seconds = 60
minimum_residence_seconds = 60

[storage]
database_path = /var/lib/powernap/powernap.db
retention_days = 30
sample_retention_days = 7

[cpu]
enabled = true
powercap_enabled = false

[gpu]
nvidia_enabled = true
amdgpu_enabled = true

[workloads]
protected_processes =
