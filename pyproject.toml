[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powernap-linux"
version = "0.9.7"
description = "Capability-aware Linux power profile daemon"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9", "requests>=2.28"]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12"]
test = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
powernap = "powernap.cli:main"

[tool.setuptools.packages.find]
include = ["powernap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
