[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powernap-linux"
version = "0.11.8"
description = "Capability-aware Linux power profile daemon"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["psutil>=5.9", "requests>=2.28"]

[project.urls]
Homepage = "https://github.com/swetoast/PowerNap"
Repository = "https://github.com/swetoast/PowerNap"
Issues = "https://github.com/swetoast/PowerNap/issues"

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12"]
test = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
powernap = "powernap.cli:main"

[tool.setuptools.packages.find]
include = ["powernap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
